  <g transform="translate(694 318)">
    <circle r="112" fill="#FFFFFF"/>
    <circle r="92" fill="#A9E34B"/>
    <circle r="70" fill="#D8F5A2"/>
    <g stroke="#A9E34B" stroke-width="12" stroke-linecap="round">
      <line x1="0" y1="-62" x2="0" y2="62"/>
      <line x1="-54" y1="-31" x2="54" y2="31"/>
      <line x1="-54" y1="31" x2="54" y2="-31"/>
    </g>
  </g>
  <!-- bowl -->
  <path d="M232 330 H792 L548 590 Q512 628 476 590 Z" fill="#FFFFFF"/>
  <!-- drink inside the bowl -->
